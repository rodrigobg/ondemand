<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ondemand Streaming de Vídeos Grátis</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        #player-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        
        #script-container {
            width: 100%;
            height: 100%;
        }
        
        /* Estilo para o iframe que será gerado */
        #script-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

<div id="player-container">
    <div id="script-container"></div>
</div>

<script>
  // Valores padrão
  const defaults = {
    vod: "707728A82AC14E388D615AAB9A847D0C",
    id: "80424",
    det: "1",
    width: "100%",
    height: "100%"
  };

  // Função para pegar query params
  function getQueryParams() {
    const params = {};
    const query = window.location.search.substring(1);
    query.split("&").forEach(part => {
      const [key, value] = part.split("=");
      if (key && value) params[key] = decodeURIComponent(value);
    });
    return params;
  }

  const params = getQueryParams();

  // Cria o script com dados dinâmicos ou padrão
  const script = document.createElement("script");
  script.src = "https://app.multisocial.com.br/unitv/ondemand.js";
  script.setAttribute("data-vod", params.vod || defaults.vod);
  script.setAttribute("data-id", params.id || defaults.id);
  script.setAttribute("data-det", params.det || defaults.det);
  script.setAttribute("data-width", params.width || defaults.width);
  script.setAttribute("data-height", params.height || defaults.height);

  // Adiciona ao DOM
  document.getElementById("script-container").appendChild(script);

  // Garante que o iframe mantenha 100% após carregamento
  script.onload = function() {
      const iframe = document.querySelector('#script-container iframe');
      if(iframe) {
          iframe.style.height = '100%';
          iframe.style.width = '100%';
      }
  };
</script>

</body>
</html>
